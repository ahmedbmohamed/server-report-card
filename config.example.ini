# server-report-card configuration: /etc/server-report-card/config.ini
# Only fill in what you need. Every value has a default. Keep this file chmod 600 (it holds passwords).

[report]
server_name = Shop web server
client_name = Example Shop Ltd
; Shown in the footer of every report. Freelancers: put your name here.
provider_name =
provider_contact =
data_dir = /var/lib/server-report-card

[email]
; Where the weekly report and the urgent alerts go.
enabled = false
smtp_host = smtp.gmail.com
smtp_port = 587
; starttls (port 587) | ssl (port 465) | none
security = starttls
smtp_user = you@example.com
; Gmail / Google Workspace: use an "app password", not your normal password.
smtp_password =
from = you@example.com
to = owner@example.com
; Alerts can go somewhere else (for example only to the administrator).
alerts_to =

[telegram]
; Create a bot with @BotFather, send it one message, then get your chat id from
; https://api.telegram.org/bot<TOKEN>/getUpdates
enabled = false
bot_token =
chat_id =

[website]
; Comma separated. Each one is checked every hour (up/down, speed, SSL certificate).
urls = https://www.example.com
; Domain registration expiry (default: taken from the urls).
domains =
; false for an internal site with a self-signed certificate.
verify_ssl = true
ssl_warn_days = 14
ssl_crit_days = 5

[email_dns]
; Domains you send email from: SPF, DKIM and DMARC are checked every day, and you are told when they change.
domains = example.com
; Your DKIM selector(s), for example google (Google Workspace) or selector1 (Microsoft 365).
dkim_selectors =
; Public IP addresses of servers that send email, checked against spam blacklists.
server_ips =

[backups]
; Found automatically for backups made by linux-server-setup-kit (restic).
; For any other backup tool: have it touch a file after each good run and put the path here.
marker_files =
max_age_hours = 26
restore_test_path = /etc
required = true

[security]
require_fail2ban = true
require_firewall = true
; Ports you opened on purpose that should not be reported as new, e.g. 51820/udp
ignore_ports =

[server]
; Services that must always run. An alert is sent when one stops.
services = nginx
disk_warn = 85
disk_crit = 95
