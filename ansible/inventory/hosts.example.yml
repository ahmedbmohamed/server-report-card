      report_card_report_client_name: Example Shop Ltd
      report_card_website_urls: [https://shop.example.com]
      report_card_email_dns_domains: [example.com]
      report_card_email_dns_dkim_selectors: [google]
      report_card_server_services: [nginx, postgresql]
  vars:
    report_card_report_provider_name: Your Name
    report_card_email_enabled: true
    report_card_email_smtp_host: smtp.gmail.com
